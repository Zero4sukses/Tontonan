name: Generate FAST Service Playlists

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hasil_playlists.yml'
      - 'generate_playlists.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: git-write-lock
  cancel-in-progress: false

jobs:
  build-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p playlists

      - name: Generate FAST Service Playlists
        env:
          PLUTO_REGION_FILTER: ${{ secrets.PLUTO_REGION_FILTER || 'us,gb,ca' }}
          PLUTO_GROUP_FILTER: ${{ secrets.PLUTO_GROUP_FILTER || 'Anime,Kids,Movies' }}
          SAMSUNG_REGION_FILTER: ${{ secrets.SAMSUNG_REGION_FILTER || 'us,gb,ca' }}
          SAMSUNG_GROUP_FILTER: ${{ secrets.SAMSUNG_GROUP_FILTER || 'Anime & Gaming,Kids,Movies' }}
          ROKU_GROUP_METHOD: ${{ secrets.ROKU_GROUP_METHOD || 'hybrid' }}
          ROKU_GROUP_FILTER: ${{ secrets.ROKU_GROUP_FILTER || 'Kids,Movies' }}
          TCL_GROUP_FILTER: ${{ secrets.TCL_GROUP_FILTER || 'Anime,Family & Kids,Movies,TCL TOP 15' }}
        run: python generate_playlists.py

      - name: Commit and Push Clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A playlists/
          if git diff-index --quiet HEAD --; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "Auto-Update Playlists $TIMESTAMP"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main -Xtheirs && git push origin main && exit 0
            git rebase --abort
            sleep 2
          done
          exit 1
