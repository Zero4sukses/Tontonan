name: Generate Master EPG Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hasil_epg.yml'
      - 'epgs/custom.channels.xml'
      - 'generate_epg.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: git-write-lock
  cancel-in-progress: false

jobs:
  build-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p epgs

      - name: Clone IPTV-ORG EPG tool
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg-tool

      - name: Install Node dependencies
        working-directory: epg-tool
        run: npm ci

      - name: Copy custom channels file
        run: cp epgs/custom.channels.xml epg-tool/sites/custom.channels.xml

      - name: Generate Base EPG
        working-directory: epg-tool
        run: |
          npm run grab -- \
            --channels=sites/custom.channels.xml \
            --output=../epgs/guide.xml \
            --maxConnections=8

      - name: Run EPG Scraper & Merger
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: python generate_epg.py

      - name: Verify Unified EPG Output
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import sys
          path = "epgs/guide.xml"
          try:
              root = ET.parse(path).getroot()
          except Exception as e:
              print(f"FATAL: guide.xml is not well-formed XML: {e}")
              sys.exit(1)
          channels = len(root.findall("channel"))
          programmes = len(root.findall("programme"))
          print(f"Stats -> Channels: {channels}, Programmes: {programmes}")
          if channels == 0 or programmes == 0:
              print("FATAL: guide.xml has zero channels or programmes.")
              sys.exit(1)
          PY

      - name: Generate channels.txt Index
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import sys
          src = Path("epgs/custom.channels.xml")
          out = Path("epgs/channels.txt")
          try:
              tree = ET.parse(src)
          except Exception as e:
              sys.exit(1)
          root = tree.getroot()
          entries = []
          for channel in root.findall("channel"):
              tvg_id = channel.attrib.get("xmltv_id", "").strip()
              name = (channel.text or "").strip()
              if tvg_id:
                  entries.append(f'{tvg_id} "{name}"')
          entries = sorted(set(entries), key=lambda x: x.lower())
          out.write_text("\n".join(entries), encoding="utf-8")
          print(f"Generated channels.txt with {len(entries)} items.")
          PY

      - name: Commit and Push Clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A epgs/
          if git diff-index --quiet HEAD --; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "Auto-Update Master EPG $TIMESTAMP"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main -Xtheirs && git push origin main && exit 0
            git rebase --abort
            sleep 2
          done
          exit 1
