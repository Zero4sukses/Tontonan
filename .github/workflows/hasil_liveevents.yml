name: Generate Live Events

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hasil_liveevents.yml'
      - 'generate_liveevents.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: git-write-lock
  cancel-in-progress: false

jobs:
  build-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p playlists

      - name: Generate Live Events
        env:
          PLAYLIST_SOURCES: ${{ secrets.PLAYLIST_SOURCES }}
        run: python generate_liveevents.py

      - name: Commit and Push Clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A playlists/
          if git diff-index --quiet HEAD --; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "Auto-Update Live Events $TIMESTAMP"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main -Xtheirs && git push origin main && exit 0
            git rebase --abort
            sleep 2
          done
          exit 1
